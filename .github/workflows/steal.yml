name: steal

# ATTACK (stage 2). A PR-branch workflow names the protected environment and
# tries to use the App key: mint a token and post an App-sourced
# reconcile=success. Expected: the job is refused the environment (deployment
# branch policy allows only main), so no step runs and no key is exposed.

on:
  pull_request:

permissions:
  contents: read

jobs:
  steal:
    runs-on: ubuntu-latest
    environment: reconcile-signer
    steps:
      - name: is the key present?
        env:
          KEY: ${{ secrets.RECONCILE_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "KEY OBTAINED"; else echo "no key"; fi
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RECONCILE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RECONCILE_APP_PRIVATE_KEY }}
          permission-statuses: write
      - name: forge an App-sourced verdict
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=success -f context=reconcile -f description="forged WITH the App key"
